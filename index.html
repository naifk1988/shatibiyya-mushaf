<style>
/* Layout: one mushaf page fills the screen; tapping an ayah raises a bottom sheet that compares the imams word by word. */
:root{
  --paper:#ffffff; --paper-edge:#f4f1ea; --ink:#111111; --ink-soft:#5d5442; --cart:#7fae96; --cart-bg:#eef6f0;
  --frame:#14463f; --bar:#4f7d4b; --gold:#a7822e; --cart-bg2:#fdfaf1; --sheet:#fffdf7; --line:#e3d8bb;
  --hl:rgba(31,107,96,.13); --hl-ink:#0f6b5c; --focus:#1f6b60;
  --tam:#14634f; --kafi:#2c6fa3; --hasan:#8a6a12; --weak:#9a5a2a; --neg:#a3322a; --lazim:#5b2a86; --other:#6b6458;
  --f-quran:"Amiri Quran","Amiri",serif;
  --f-display:"Amiri","Traditional Arabic",serif;
  --f-ui:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141412; --paper-edge:#1d1c19; --ink:#ece6d6; --cart:#4f7d68; --cart-bg:#1b2621; --ink-soft:#b5aa90;
  --frame:#4fa393; --bar:#2f4f2e; --gold:#d3b06a; --cart-bg2:#1f1d18; --sheet:#22201a; --line:#3a3528;
  --hl:rgba(108,194,177,.16); --hl-ink:#7fd6c4; --focus:#6cc2b1;
  --tam:#4fbf9c; --kafi:#6aa9dc; --hasan:#d6b55a; --weak:#d89160; --neg:#e07a70; --lazim:#b48ae0; --other:#a59d8c;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141412; --paper-edge:#1d1c19; --ink:#ece6d6; --cart:#4f7d68; --cart-bg:#1b2621; --ink-soft:#b5aa90;
  --frame:#4fa393; --bar:#2f4f2e; --gold:#d3b06a; --cart-bg2:#1f1d18; --sheet:#22201a; --line:#3a3528;
  --hl:rgba(108,194,177,.16); --hl-ink:#7fd6c4; --focus:#6cc2b1;
  --tam:#4fbf9c; --kafi:#6aa9dc; --hasan:#d6b55a; --weak:#d89160; --neg:#e07a70; --lazim:#b48ae0; --other:#a59d8c;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--paper-edge);color:var(--ink);font-family:var(--f-ui);margin:0;overflow:hidden;-webkit-tap-highlight-color:transparent}
body:not(.chrome)::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:30}
#app{display:flex;flex-direction:column;height:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}

/* floating toolbars (shown on tap, over the page, like mushaf reading apps) */
.fbar{position:fixed;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));z-index:20;
  background:var(--bar);color:#fff;border-radius:16px;box-shadow:0 6px 20px rgba(0,0,0,.18);
  transition:opacity .22s,transform .22s;max-width:760px;margin:0 auto}
.fbar.top{top:calc(8px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:2px;padding:6px 8px}
.fbar.bot{bottom:calc(10px + env(safe-area-inset-bottom,0px));padding:8px 10px 6px}
body:not(.chrome) .fbar{opacity:0;pointer-events:none}
body:not(.chrome) .fbar.top{transform:translateY(-12px)}
body:not(.chrome) .fbar.bot{transform:translateY(12px)}
.fbar .title{flex:1;min-width:0;text-align:center;line-height:1.15}
.fbar .sname{display:block;font-family:var(--f-display);font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar .meta{display:block;font-size:11.5px;opacity:.85;font-variant-numeric:tabular-nums}
.fbar .row{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:4px}
.ibtn{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:#fff;flex:none}
.ibtn:active{background:rgba(255,255,255,.16)}
.ibtn[aria-pressed="true"]{background:rgba(255,255,255,.2)}
.ibtn svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fbar input#pgIn{width:64px;height:34px;text-align:center;border:0;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;font:inherit;font-weight:600;font-variant-numeric:tabular-nums}
#pgRange{width:100%;height:24px;margin:0;accent-color:#e9d8a6;direction:rtl;background:transparent}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:rgba(20,20,18,.85);color:#fff;
  font-size:14px;padding:8px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* page — styled like the printed Madinah page in mushaf apps: plain page, running head, 15 justified lines, page cartouche */
#stage{flex:1;min-height:0;overflow:auto;overflow-x:hidden;display:flex;flex-wrap:wrap;align-content:flex-start;justify-content:center;background:var(--paper);touch-action:pan-y;position:relative;
  padding-top:max(6px,env(safe-area-inset-top,0px));padding-bottom:max(6px,env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.page{will-change:transform;background:var(--paper);width:100%;max-width:760px;display:flex;flex-direction:column;position:relative;align-self:flex-start}
.page.fixed{height:100%;align-self:stretch}
.page.fixed .lines{flex:1;justify-content:space-between;min-height:0}
.page.fixed .line{min-height:0;line-height:1.25}
.phead{display:flex;justify-content:space-between;align-items:center;direction:rtl;font-family:var(--f-ui);font-size:15px;color:var(--ink);padding:0 4px 2px;min-height:30px}
.phead .g{font-family:q4f0;font-size:32px;line-height:1;font-weight:400}
.phead .ps{font-family:var(--f-display);font-size:18px}
.lines{display:flex;flex-direction:column;direction:rtl;color:var(--ink)}
.line{display:flex;justify-content:space-between;align-items:center;white-space:nowrap;min-height:1.95em;line-height:1.95}
.line.center{justify-content:center;gap:.3em}
.w{cursor:pointer;border-radius:4px;position:relative;transition:background .15s}
.w.hl{color:var(--hl-ink)}
.w.tap{background:var(--hl);border-radius:4px}
body.marks .w.has::after{content:"";position:absolute;left:50%;bottom:.08em;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--focus);opacity:.55}
/* one imam chosen: his ruling is written above the word, like the pause signs of the printed mushaf */
body.marks .w.has[data-m]::after{content:attr(data-m);bottom:auto;top:-.62em;width:auto;height:auto;margin:0;transform:translateX(-50%);opacity:1;
  font:700 .46em/1 var(--f-ui);color:#fff;background:var(--cc,var(--focus));border-radius:.5em;padding:.14em .32em .18em;white-space:nowrap;letter-spacing:0;
  box-shadow:0 0 0 .1em var(--paper);z-index:2}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip-i{flex:none;display:flex;align-items:center;gap:6px;height:34px;padding:0 12px 0 10px;border-radius:17px;background:rgba(255,255,255,.14);color:#fff;font-size:14px;font-weight:600;white-space:nowrap}
.chip-i i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--bar);font:700 12px/1 var(--f-display)}
.chip-i[aria-pressed="true"]{background:#f3e3b3;color:#2c3a20}
.chip-i[aria-pressed="true"] i{background:var(--bar);color:#fff}
.mleg{font-size:11.5px;opacity:.9;padding:0 2px 6px;line-height:1.5}
.onlyTag{position:fixed;top:calc(6px + env(safe-area-inset-top,0px));left:max(8px,env(safe-area-inset-left,0px));z-index:15;font-size:12px;font-weight:600;
  background:var(--bar);color:#fff;border-radius:12px;padding:3px 10px;opacity:.85;transition:opacity .2s}
body.chrome .onlyTag,.onlyTag:empty{opacity:0;pointer-events:none}
.end{color:var(--ink)}
.basm{justify-content:center;font-family:var(--f-quran)}
/* surah header — four styles, chosen with body[data-hdr]; the name is the calligraphic glyph of the 1441 print, flanked by its own flourishes */
.shead{justify-content:center;align-items:center;position:relative;margin:.04em 0;height:1.62em;min-height:1.62em!important;padding:0;gap:.12em}
.shead .nm{position:relative;z-index:1;line-height:1;white-space:nowrap}
.shead .nm.t{font-family:var(--f-display);font-weight:700;font-size:.7em}
.shead .nm.g{font-family:q4f0;font-size:1.3em}
.shead .fl{position:relative;z-index:1;font-family:q4f0;font-size:1.15em;line-height:1;color:var(--gold)}
.shead .rule,.shead svg{display:none}
.shead .fr::before{content:"\FAE5"}.shead .fl2::before{content:"\FAE4"}
/* 1 gold cartouche with pointed ends */
body[data-hdr="1"] .shead svg{display:block;position:absolute;inset:0;width:100%;height:100%}
body[data-hdr="1"] .shead .nm{color:#3b2a10}
/* 2 calligraphy and flourishes with double rules, no frame */
body[data-hdr="2"] .shead .rule{display:block;flex:1;height:.2em;border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
body[data-hdr="2"] .shead .nm{color:var(--ink);font-size:1.38em}
body[data-hdr="2"] .shead .fr::before{content:"\FAF5"}body[data-hdr="2"] .shead .fl2::before{content:"\FAF4"}
/* 3 calm green band with gold hairline */
body[data-hdr="3"] .shead{background:#2f5d45;border-radius:.24em;box-shadow:inset 0 0 0 .12em #2f5d45,inset 0 0 0 .16em #d9c27e}
body[data-hdr="3"] .shead::before{content:"";position:absolute;left:25%;right:25%;top:.2em;bottom:.2em;background:#fbf7ea;border:1.5px solid #d9c27e;border-radius:1em}
body[data-hdr="3"] .shead .nm{color:#2f5d45;font-size:1.15em}body[data-hdr="3"] .shead .nm.t{font-size:.66em}
body[data-hdr="3"] .shead .fl{font-size:.85em}
body[data-hdr="3"] .shead .fr::before{content:"\FAE7"}body[data-hdr="3"] .shead .fl2::before{content:"\FAE6"}
/* 4 simple double-line frame, flourishes at the ends */
body[data-hdr="4"] .shead{justify-content:space-between;padding:0 .3em;margin:.18em .16em;height:1.5em;min-height:1.5em!important;
  border:1px solid var(--gold);outline:1px solid var(--gold);outline-offset:.12em;background:var(--cart-bg2)}
body[data-hdr="4"] .shead .nm{color:var(--ink)}
body[data-hdr="4"] .shead .fr::before{content:"\FAFD"}body[data-hdr="4"] .shead .fl2::before{content:"\FAFC"}
.shead.banner{background:url(img/surah_banner.webp) center/100% 100% no-repeat!important;box-shadow:none!important;outline:0!important;border:0!important;
  padding:0!important;margin:.05em 0!important;height:auto!important;min-height:0!important;aspect-ratio:1400/165;width:100%;align-self:center}
.shead.banner::before,.shead.banner svg,.shead.banner .rule,.shead.banner .fl{display:none!important}
.shead.banner .nm.g{font-size:1.32em;color:#1f2a1c;transform:translateY(-.04em)}
.basm.glyph{font-size:.92em}
.page.q4 .basm span{font-size:1em}
.qtr{color:var(--ink)}
.page>.shead{font-size:24px;margin:6px 0}
.flow{direction:rtl;text-align:justify;text-align-last:center;font-family:var(--f-quran);line-height:2.3;font-size:22px}
.flow .num{font-family:var(--f-display);font-size:.78em;margin:0 .12em;display:inline-grid;place-items:center;min-width:1.7em;height:1.7em;
  border:1.5px solid var(--cart);border-radius:50%;line-height:1;vertical-align:.15em;background:var(--cart-bg)}
.pfoot{display:flex;justify-content:center;margin-top:6px}
.pfoot span{font-family:var(--f-display);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);
  border:1px solid var(--gold);background:var(--cart-bg2);border-radius:10px;padding:0 22px;line-height:1.7;box-shadow:0 0 0 2px var(--cart-bg2),0 0 0 3px var(--gold)}
.notice{flex:0 0 100%;max-width:620px;margin:0 auto 8px;font-size:12.5px;color:var(--ink-soft);background:var(--sheet);border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
.loading{padding:60px 0;text-align:center;color:var(--ink-soft)}
/* neighbouring page shown beside the current one while swiping */
.ghost{position:absolute;inset:0;display:flex;justify-content:center;pointer-events:none;background:var(--paper);
  padding:inherit;box-sizing:border-box;will-change:transform}


/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;inset:auto 0 0 0;z-index:50;background:var(--sheet);border-radius:18px 18px 0 0;
  box-shadow:0 -10px 40px rgba(0,0,0,.18);max-height:86%;display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .25s ease;max-width:720px;margin:0 auto}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.grip{width:42px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 2px}
.shd{display:flex;align-items:center;gap:8px;padding:4px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.shd h2{flex:1;margin:0;font-family:var(--f-display);font-size:19px;color:var(--frame)}
.shd .x{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink-soft)}
.sbody{overflow:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));-webkit-overflow-scrolling:touch}
.ayah{font-family:var(--f-quran);font-size:22px;line-height:2.2;direction:rtl;text-align:center;margin:0 0 10px}
.ayah .aw{padding:0 3px;cursor:pointer;border-radius:6px;border-bottom:2.5px solid transparent;transition:background .15s}
.ayah .aw.has{border-bottom:2px dotted var(--focus)}
.ayah .aw.sel{background:var(--hl)}
.ayah .an{color:var(--ink-soft);font-size:.8em}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;padding:1px 10px;border-radius:999px;line-height:1.7;white-space:nowrap;
  color:var(--cc);background:color-mix(in srgb,var(--cc) 12%,transparent)}
.c-tam{--cc:var(--tam)}.c-kafi{--cc:var(--kafi)}.c-hasan{--cc:var(--hasan)}.c-weak{--cc:var(--weak)}.c-neg{--cc:var(--neg)}.c-lazim{--cc:var(--lazim)}.c-other{--cc:var(--other)}.c-ibtida{--cc:var(--frame)}
.sheet{direction:rtl}
.sbody{background:var(--paper-edge)}
.shd{border-bottom:0!important;padding-top:8px!important}
.shd h2{display:flex;flex-direction:column;gap:2px;font-family:var(--f-ui)!important;font-weight:400!important}
.shd h2 small{font-size:13px;color:var(--ink-soft)}
.shd h2 span{font-size:21px;color:var(--ink)}
.shd .x{width:46px!important;height:46px!important;border-radius:50%!important;border:2.5px solid var(--gold);background:var(--sheet);font-size:18px}
.tayah{font-family:var(--f-quran);font-size:24px;line-height:2.1;direction:rtl;text-align:center;background:var(--sheet);padding:0 max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px))}
.tayah .an{color:var(--ink-soft);font-size:.75em}
.tabs{display:flex;flex-wrap:wrap;gap:0 18px;background:var(--sheet);border-bottom:1px solid var(--line);padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.tab{display:flex;align-items:center;gap:8px;padding:10px 2px 9px;font-size:16px;color:var(--ink-soft);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab b{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 5px;border-radius:7px;background:var(--paper-edge);font-size:12px;font-weight:600;color:var(--ink-soft)}
.tab.on{color:var(--frame);font-weight:700;border-bottom-color:var(--frame)}
.tab.on b{color:var(--frame);background:color-mix(in srgb,var(--frame) 12%,transparent)}
.tab.zero{opacity:.55}
.tnote{font-size:12.5px;color:var(--ink-soft);margin:2px 2px 12px;line-height:1.7}
.wc{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 14px}
.wc .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.wc .q{font-family:var(--f-quran);font-size:30px;line-height:1.5}
.wc .rule{flex:none;font-size:14.5px;padding:6px 14px;border-radius:10px;border:1px solid color-mix(in srgb,var(--cc) 35%,transparent);background:color-mix(in srgb,var(--cc) 8%,var(--sheet));color:var(--cc);font-weight:600}
.wc .meta{font-size:13px;color:var(--ink-soft);line-height:1.7;margin:4px 0 0}
.wc .why{border-top:1px solid var(--line);margin-top:12px;padding-top:12px;font-family:"Amiri",serif;font-size:18px;line-height:1.9;color:var(--ink);overflow-wrap:anywhere}
.wc .ex{font-size:12.5px;color:var(--ink-soft);margin-top:6px}
.wc{padding:14px 15px 12px!important;margin-bottom:10px!important;border-radius:14px!important}
.wc .q{font-size:26px!important}
.wc .rules{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.wc .rule{font-size:14px!important;padding:4px 12px!important;border-radius:9px!important}
.wc .why{font-size:16px!important;line-height:1.75!important;margin-top:10px!important;padding-top:10px!important}
.wc .ex{font-size:12px!important;margin-top:4px;font-family:var(--f-ui)}
.wc .src{font-size:12px;color:var(--ink-soft);margin-top:8px}
.tayah{font-size:22px!important;line-height:1.95!important}
.tab{font-size:15px!important}
.tnote{font-size:12px!important}
.empty{color:var(--ink-soft);text-align:center;padding:18px 0;font-size:14px}
.sec{font-size:12px;color:var(--ink-soft);margin:16px 2px 4px;font-weight:600}
/* panels */
.panel h4{margin:14px 0 6px;font-size:13px;color:var(--ink-soft);font-weight:600}
.blist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.bitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.bitem:first-child{border-top:0}
.bitem .bn{flex:1;min-width:0}
.bitem .bn b{display:block;font-size:14.5px}
.bitem .bn span{font-size:12px;color:var(--ink-soft)}
.bitem .n{font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.sw{appearance:none;width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:right .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw:checked{background:var(--frame)}
.sw:checked::after{right:21px}
.slist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.sitem{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;text-align:start}
.sitem .no{font-size:11px;color:var(--ink-soft);width:22px;font-variant-numeric:tabular-nums}
.sitem .nm{font-family:var(--f-display);font-size:17px;flex:1}
.sitem .pg{font-size:11px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.sitem.cov{border-color:var(--gold)}
.small{font-size:12.5px;color:var(--ink-soft);line-height:1.7}
/* Shatibiyya card: word and bayt number, the bayt as a two-hemistich verse, readers, meaning, tawjih, sources */
.wc .bno{flex:none;font-size:12.5px;font-weight:600;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:999px;padding:2px 10px;margin-top:6px;white-space:nowrap}

/* ---------- Arabic matching (runtime alignment of a book's cue to the mushaf's words) ---------- */
function norm(s){
  return String(s||"")
    .replace(/[ؐ-ًؚ-ٰٟۖ-ۭـ࣓-ࣿ]/g,"")
    .replace(/[ٱأإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي")
    .replace(/[^ء-ي ]/g," ").replace(/\s+/g," ").trim()
    .replace(/(^| )يا (?=\S)/g,"$1يا") // the mushaf writes يا + noun as one word
    .replace(/اليل/g,"الليل").replace(/ص/g,"س"); // rasm spellings (اليل، يبصط) must still match the books' cues
}
const skel=s=>{const n=norm(s);return n.replace(/[اويءى ]/g,"")||n.replace(/ /g,"")}; // consonant skeleton survives Uthmani vs. imla'i spelling

// Find the word a cue names. Tiers, each anchored on whole words: exact spelling, then consonant skeleton (Uthmani vs imla'i),
// then the old suffix search as a last resort. "(الثانية)" picks the nth match.
function alignCue(cue,words,type){
  let nth=1;cue=String(cue||"").replace(/[(（\[]([^)\]）]*)[)\]）]/g,(m,x)=>{x=x.trim();if(ORD[x])nth=ORD[x];return " "});
  const toks=norm(cue).split(" ").filter(Boolean);if(!toks.length)return -1;
  const seq=(f)=>{const t=toks.map(f),W=words.map(f);let seen=0,last=-1;
    for(let i=0;i+t.length<=W.length;i++){if(t.every((x,j)=>W[i+j]===x)){seen++;last=i+t.length-1;if(seen===nth)return last}}
    return seen?last:-1};
  let w=seq(x=>norm(x).replace(/ /g,""));if(w>=0)return w;
  w=seq(skel);if(w>=0)return w;
  return alignSuffix(toks,words,nth);
}
function alignSuffix(toks,words,nth){
  const sk=words.map(skel);let S="",ends=[];
  sk.forEach(k=>{S+=k;ends.push(S.length)});
  const tryFind=c=>{
    if(!c)return -1;let i=S.indexOf(c),seen=0,last=-1;
    while(i!==-1){const w=ends.indexOf(i+c.length);
      if(w!==-1){seen++;last=w;if(seen===nth)return w}
      i=S.indexOf(c,i+1);}
    return last;};
  let w=tryFind(toks.map(skel).join(""));
  if(w<0&&toks.length>1)w=tryFind(skel(toks[toks.length-1]));
  return w;
}

const Q4_FONT_BASES=window.Q4_FONT_BASES||["https://cdn.jsdelivr.net/npm/quran-qcf4@1.1.0/fonts-woff2/","https://cdn.jsdelivr.net/gh/MohamadHajjRabee/quran-qcf4@5130511027e769f0a8f4eeb7f00f46bde3788d60/fonts-woff2/"];
const q4file=n=>n===0?"QCF4_QBSML.woff2":`QCF4_Hafs_${String(n).padStart(2,"0")}_W.woff2`;
const fontsLoaded={};
function loadQ4Font(n){
  if(fontsLoaded[n])return fontsLoaded[n];
  const src=Q4_FONT_BASES.map(b=>`url(${b}${q4file(n)}) format("woff2")`).join(",");
  fontsLoaded[n]=new FontFace("q4f"+n,src,{display:"block"}).load().then(f=>{document.fonts.add(f);return true}).catch(()=>{delete fontsLoaded[n];return false});

async function fetchLivePage(p){

(function(){let x0=null,y0=null,dx=0,drag=false,pg=null,gh=null,ghN=0;const s=$("#stage");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ghost=n=>{if(ghN===n)return gh;if(gh){gh.remove();gh=null}ghN=n;const c=st.pages[n];if(!c||st.mode!=="live")return null;
    gh=document.createElement("div");gh.className="ghost";gh.innerHTML=pageHTML(c,n).html;gh.style.top=s.scrollTop+"px";s.appendChild(gh);fitLines(gh.querySelector(".lines"));return gh};
  const place=(m)=>{pg.style.transform=`translate3d(${m}px,0,0)`;const w=s.clientWidth;
    if(gh)gh.style.transform=`translate3d(${m>0?m-w:m+w}px,0,0)`};
  s.addEventListener("touchstart",e=>{if(e.touches.length!==1||$("#sheet").classList.contains("on")){x0=null;return}
    x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;drag=false;pg=s.querySelector(":scope>.page")},{passive:true});
  s.addEventListener("touchmove",e=>{if(x0==null||!pg)return;dx=e.touches[0].clientX-x0;const dy=e.touches[0].clientY-y0;
    if(!drag){if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.2)drag=true;else{if(Math.abs(dy)>14)x0=null;return}}
    const n=st.page+(dx>0?1:-1);const edge=n<1||n>604;
    if(!edge)ghost(n);else if(gh){gh.remove();gh=null;ghN=0}
    pg.style.transition="none";if(gh)gh.style.transition="none";place(edge?dx*.25:dx)},{passive:true});
  const end=()=>{if(x0==null)return;x0=null;if(!drag||!pg)return;drag=false;st.noClick=Date.now();
    const d=dx>0?1:-1,n=st.page+d,w=s.clientWidth;
    if(Math.abs(dx)>Math.min(80,w*.2)&&n>=1&&n<=604){
      if(reduce){if(gh)gh.remove();gh=null;ghN=0;go(d);return}
      const t="transform .22s cubic-bezier(.25,.8,.3,1)";pg.style.transition=t;if(gh)gh.style.transition=t;place(dx>0?w:-w);
      const had=!!gh;setTimeout(()=>{if(gh){gh.remove();gh=null;ghN=0}st.page=n;st.slideFrom=had?0:-d;closeSheet();render()},210);
    }else{const t="transform .2s ease-out";pg.style.transition=t;if(gh)gh.style.transition=t;place(0);

const QUIZ={type:"mix",n:0,ok:0,cur:null};
function quizPool(){
  const seen=new Set(),out=[];
  Object.entries(DATA.entries).forEach(([k,list])=>list.forEach(e=>{const id=e.bayt_no+"|"+e.cue;if(seen.has(id))return;seen.add(id);out.push(Object.assign({key:k},e))}));
  return out;
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const hemis=e=>String(e.bayt||"").split(/\n+/)[0].split(/\s*\.\.\.\s*/);
const keyName=k=>{const [s,a]=k.split(":").map(Number);return `${SURAHS[s-1]} ${ar(a)}`};
function makeQ(pool){
  const t=QUIZ.type==="mix"?pick(["who","bayt","complete"]):QUIZ.type;
  for(let tries=0;tries<40;tries++){
    const e=pick(pool);
    if(t==="who"){const rs=(e.readings||[]).filter(r=>r.q&&r.q.length&&!r.q.includes("hafs")&&r.w);if(!rs.length)continue;const r=pick(rs);
      const wrong=shuffle([...new Set(pool.flatMap(x=>(x.readings||[]).map(y=>y.who)).filter(w=>w&&w!==r.who&&!/حفص|الباقون/.test(w)))]).slice(0,3);if(wrong.length<3)continue;
      return {t,e,q:`من قرأ «${r.w}» في ${keyName(e.key)}؟`,right:r.who,opts:shuffle([r.who,...wrong])}}
    if(t==="bayt"){const near=pool.filter(x=>x.bayt_no!==e.bayt_no&&Math.abs(x.bayt_no-e.bayt_no)<=12);const wrong=shuffle([...new Set(near.map(x=>hemis(x)[0]))]).filter(x=>x!==hemis(e)[0]).slice(0,3);if(wrong.length<3)continue;
      return {t,e,q:`في أي بيت حُكم «${e.cue.replace(/\(.*?\)/g,"").trim()}» (${keyName(e.key)})؟`,right:hemis(e)[0],opts:shuffle([hemis(e)[0],...wrong]),sub:"اختر صدر البيت"}}
    if(t==="complete"){const hs=hemis(e);if(hs.length<2)continue;const wrong=shuffle([...new Set(pool.map(x=>hemis(x)[1]).filter(x=>x&&x!==hs[1]))]).slice(0,3);if(wrong.length<3)continue;
      return {t,e,q:hs[0]+" …",right:hs[1],opts:shuffle([hs[1],...wrong]),sub:`أكمل البيت ${ar(e.bayt_no)}`,verse:true}}
  }
  return null;
}
async function openQuiz(){
  await ensureSurahs([1,2]);const pool=quizPool();
  if(pool.length<8){$("#shTop").innerHTML="";$("#shTitle").textContent="وضع الحفظ";$("#shBody").innerHTML=`<div class="empty">لا توجد بيانات كافية.</div>`;openSheet();return}

}
